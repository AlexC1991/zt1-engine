# Releases, to GitHub and CodeRook alike.
#
# - Every push to main: the "newest build". On GitHub it replaces the
#   pre-release tagged `newest`; on CodeRook, main's code is mirrored to the
#   zt1-engine project.
# - A weekly alpha: push an annotated tag named alpha-YYYY-MM-DD, its message
#   being the release notes:
#       git tag -a alpha-2026-10-19 -F notes.md && git push origin alpha-2026-10-19
#   It becomes a GitHub release, and a named version of the
#   zt1-engine-releases project on CodeRook carrying the same zip.
#
# CodeRook needs a personal access token (CodeRook > account settings) saved
# as this repository's secret CODEROOK_TOKEN. Without it, the CodeRook steps
# are skipped and GitHub still gets everything.
name: Release

on:
  push:
    branches: [main]
    tags: ['alpha-*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CODEROOK_TOKEN: ${{ secrets.CODEROOK_TOKEN }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/alpha-') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Name and notes
        shell: bash
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME}"
            TITLE="Alpha build ${NAME#alpha-}"
            git tag -l --format='%(contents)' "$NAME" > notes.md
          else
            NAME="newest"
            TITLE="Newest build ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})"
            { echo "The newest build of main: not a weekly alpha, so expect more rough edges."
              echo
              echo "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"; } > notes.md
          fi
          [ -s notes.md ] || echo "$TITLE" > notes.md
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"

      - name: Build and package
        run: python engine-build-resources/make_release.py --version ${{ env.NAME }}

      - name: GitHub release
        shell: bash
        run: |
          ZIP=$(ls dist/*.zip)
          if [ "$IS_TAG" = "true" ]; then
            gh release create "$NAME" "$ZIP" "$ZIP.sha256" --title "$TITLE" --notes-file notes.md --verify-tag
          else
            gh release delete newest --yes --cleanup-tag 2>/dev/null || true
            gh release create newest "$ZIP" "$ZIP.sha256" --title "$TITLE" --notes-file notes.md --prerelease --target "$GITHUB_SHA"
          fi

      - name: CodeRook
        if: env.CODEROOK_TOKEN != ''
        shell: bash
        run: |
          npm install -g @coderook/cli >/dev/null
          cbx sign-in --token "$CODEROOK_TOKEN"
          if [ "$IS_TAG" = "true" ]; then
            python engine-build-resources/coderook_release.py --name "$NAME" --notes notes.md --zip "$(ls dist/*.zip)"
          else
            cbx link zt1-engine .
            # (--allow-private: cbx mistakes FreeType's src/cache, its font
            # cache code, for a browser profile; --no-licence: LICENSE.txt is
            # the licence)
            cbx submit . --allow-private --no-licence -m "$(git log -1 --format=%s) (${GITHUB_SHA::7})"
          fi
