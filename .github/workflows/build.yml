# Every push and every pull request: does the engine build (Windows, MSVC,
# x64, Release)? The exe is kept for a week as the run's artifact, for anyone
# testing a pull request. (The self-test and the formula checks need Zoo
# Tycoon's own files, which can't be on a build server: run them in the ZT1
# Lab. Official builds - the installer, the Game Build and their signed
# update feeds - are made outside this repository.)
name: Build

on:
  push:
    # (a tag filter alone would leave branches out: GitHub runs a push
    # workflow for a ref only when its own filter names it)
    branches: ['**']
    tags-ignore: ['*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-x64 -A x64 -DZT1_STATIC_RUNTIME=ON
      - name: Build
        run: |
          cmake --build build-x64 --config Release --target SDL2_image SDL2_mixer --parallel
          cmake --build build-x64 --config Release --target zt1-engine --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: zt1-engine-${{ github.run_number }}
          path: build-x64/Release/zt1-engine.exe
          retention-days: 7
