# Every push and pull request: does the engine build (Windows, MSVC, x64)?
# The zip it makes is kept for a week as the run's artifact, for anyone
# testing a pull request. (The self-test and the formula checks need Zoo
# Tycoon's own files, which can't be on a build server: run them in the ZT1
# Lab before a release.)
name: Build

on:
  push:
    branches-ignore: [main]   # (main and the alpha tags build in release.yml)
    tags-ignore: ['*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and package
        run: python engine-build-resources/make_release.py --version build-${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: zt1-engine-build-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 7
