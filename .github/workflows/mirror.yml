# Every push to main: the engine's open-source tree is mirrored to the
# zt1-engine project on CodeRook (a save of it; releases are named there
# separately, with their downloads).
#
# CodeRook needs a personal access token (CodeRook > account settings) saved
# as this repository's secret CODEROOK_TOKEN. Without it, nothing is mirrored.
name: Mirror

on:
  push:
    branches: [main]

concurrency:
  group: mirror
  cancel-in-progress: true

jobs:
  coderook:
    runs-on: ubuntu-latest
    env:
      CODEROOK_TOKEN: ${{ secrets.CODEROOK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CODEROOK_TOKEN != ''
      - name: CodeRook
        if: env.CODEROOK_TOKEN != ''
        shell: bash
        run: |
          npm install -g @coderook/cli@0.39.0 >/dev/null
          cbx sign-in --token "$CODEROOK_TOKEN"
          message="$(git log -1 --format=%s) (${GITHUB_SHA::7})"
          # Send exactly the committed tree, including tracked files that an
          # ignore rule may name. No local ignored files enter this export.
          mirror="$(mktemp -d)"
          git archive HEAD | tar -x -C "$mirror"
          cd "$mirror"
          cbx link zt1-engine .
          # This checkout never had CodeRook's private release tooling. Preserve
          # it, while --sync still removes public files deliberately deleted in Git.
          NODE_PATH="$(npm root -g)" node .github/scripts/coderook-retain-private.cjs
          # (--sync: a file that's left the repository leaves the mirror too,
          # rather than staying from the last save; --allow-private: cbx
          # mistakes FreeType's src/cache, its font cache code, for a browser
          # profile; --no-licence: LICENSE.txt is the licence)
          # --allow-ignored also acknowledges the protected remote tooling
          # retained above; CodeRook still enforces its private-path settings.
          cbx submit . --sync --allow-private --allow-ignored --no-licence -m "$message"
