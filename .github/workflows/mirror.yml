# Every push to main: the engine's open-source tree is mirrored to the
# zt1-engine project on CodeRook (a save of it; releases are named there
# separately, with their downloads).
#
# CodeRook needs a personal access token (CodeRook > account settings) saved
# as this repository's secret CODEROOK_TOKEN. Without it, nothing is mirrored.
name: Mirror

on:
  push:
    branches: [main]

concurrency:
  group: mirror
  cancel-in-progress: true

jobs:
  coderook:
    runs-on: ubuntu-latest
    env:
      CODEROOK_TOKEN: ${{ secrets.CODEROOK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CODEROOK_TOKEN != ''
      - name: CodeRook
        if: env.CODEROOK_TOKEN != ''
        shell: bash
        run: |
          npm install -g @coderook/cli >/dev/null
          cbx sign-in --token "$CODEROOK_TOKEN"
          cbx link zt1-engine .
          # (--allow-private: cbx mistakes FreeType's src/cache, its font
          # cache code, for a browser profile; --no-licence: LICENSE.txt is
          # the licence)
          cbx submit . --allow-private --no-licence -m "$(git log -1 --format=%s) (${GITHUB_SHA::7})"
